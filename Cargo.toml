[workspace]
members = [
    "crates/the-browser-core",
    "crates/the-browser-storage",
    "crates/the-browser-engine",
    "crates/the-browser-shell",
]
default-members = ["crates/the-browser-shell"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["The Browser Team"]
license = "MIT"

[workspace.dependencies]
the-browser-core = { path = "crates/the-browser-core" }
the-browser-storage = { path = "crates/the-browser-storage" }
the-browser-engine = { path = "crates/the-browser-engine" }

gtk4 = { version = "0.11", features = ["v4_18"] }
libadwaita = "0.9.2"
webkit6 = { version = "0.6.1", features = ["v2_42"] }
glib = "0.22"
gio = "0.22"
rusqlite = "0.43.0"
url = "2.5"
uuid = { version = "1.16", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
